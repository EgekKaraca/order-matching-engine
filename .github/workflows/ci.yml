name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux is the primary target because the benchmark harness only runs there.
  # macOS is built too, since day-to-day development happens on a Mac and its
  # older libc++ catches C++20 features that would not port back.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
          - os: ubuntu-latest
            cc: clang-18
            cxx: clang++-18
          - os: macos-latest
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # clang-18 is not preinstalled on the current runner image, so the
      # compiler the matrix names has to be installed rather than assumed.
      - name: Install clang-18
        if: matrix.cxx == 'clang++-18'
        run: sudo apt-get update && sudo apt-get install -y clang-18

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMATCH_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          find libmatch libsim adapters studies tests tools \
            -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \
            | xargs --no-run-if-empty clang-format --dry-run --Werror
